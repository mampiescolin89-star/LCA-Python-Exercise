<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>South African Provinces Table</title>
    <style>
        table {
            border-collapse: collapse;
            margin: 20px;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <h1>South African Provinces</h1>
    <table>
        <thead>
            <tr>
                <th>Rank</th>
                <th>Province</th>
                <th>Population (2011)</th>
                <th>Area (km²)</th>
                <th>Density (per km²)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Gauteng</td>
                <td>12,272,263</td>
                <td>18,178</td>
                <td>675.1</td>
            </tr>
            <tr>
                <td>2</td>
                <td>KwaZulu-Natal</td>
                <td>10,267,300</td>
                <td>120,361</td>
                <td>85.3</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Mpumalanga</td>
                <td>4,039,939</td>
                <td>76,495</td>
                <td>52.8</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Western Cape</td>
                <td>5,822,734</td>
                <td>129,462</td>
                <td>45.0</td>
            </tr>
            <tr>
                <td>5</td>
                <td>Limpopo</td>
                <td>5,404,868</td>
                <td>125,755</td>
                <td>43.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
